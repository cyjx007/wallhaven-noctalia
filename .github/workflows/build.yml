name: build

on:
  push:
  pull_request:

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build package (runs unit tests)
        run: nix build --no-link --print-out-paths .#wallhaven-sync
